# API only — pair with `cd apps/web && npm run dev` (hot reload)
services:
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    ports:
      - "3022:3022"
    env_file:
      - ../.env
    environment:
      - PORT=3022
      - NODE_ENV=development
      - WEB_ORIGIN=http://localhost:4321
